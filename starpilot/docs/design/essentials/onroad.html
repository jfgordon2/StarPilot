<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onroad default</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; padding: 10px; font-family: Figtree, system-ui, sans-serif; color: #F2F5F9;">
  <div style="width: 100%; height: 100%; box-sizing: border-box; border: 6px solid #1F9A55; border-radius: 18px; overflow: hidden; position: relative; background: #0F1A24;">
    <svg width="1093" height="531" viewBox="0 0 1093 531" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
      <rect x="0" y="0" width="1093" height="230" fill="#0F1A24"></rect>
      <rect x="0" y="230" width="1093" height="301" fill="#132231"></rect>
      <path d="M520 226 L210 460" stroke="#5C6B7A" stroke-width="5" stroke-linecap="round"></path>
      <path d="M576 226 L890 460" stroke="#5C6B7A" stroke-width="5" stroke-linecap="round"></path>
      <path d="M534 228 L560 228 L688 452 L418 452 Z" fill="#3A73B3" fill-opacity="0.55"></path>
    </svg>
    <div style="position: absolute; left: 18px; top: 18px; width: 82px; height: 98px; border-radius: 14px; background: #0B0D10; display: flex; align-items: center; justify-content: center;">
      <div style="width: 62px; height: 78px; box-sizing: border-box; border-radius: 8px; background: #FFFFFF; border: 3px solid #0B0D10; outline: 2px solid #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B0D10; line-height: 1;">
        <span style="font-size: 10px; font-weight: 800;">SPEED</span>
        <span style="font-size: 10px; font-weight: 800;">LIMIT</span>
        <span style="font-size: 32px; font-weight: 800; margin-top: 2px;">60</span>
      </div>
    </div>
    <div style="position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: #0B0D10E6; border-radius: 22px; padding: 10px 40px 10px 30px; display: flex; align-items: center; gap: 22px;">
      <svg width="46" height="30" viewBox="0 0 46 30" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5L8 15l10 10" stroke="#3FD08A"></path><path d="M36 5L26 15l10 10" stroke="#2A8F5E"></path></svg>
      <div style="display: flex; flex-direction: column; align-items: center; line-height: 1;">
        <span style="font-size: 62px; font-weight: 800;">62</span>
        <span style="font-size: 17px; color: #C9D0DA;">mph</span>
      </div>
    </div>
    <div style="position: absolute; right: 18px; top: 22px; display: flex; align-items: center; gap: 8px; background: #0B0D10E6; border-radius: 14px; padding: 0 16px; height: 44px; font-size: 16px; font-weight: 600; color: #C9D0DA;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18c6 0 6-12 16-12"></path></svg>
      Slowing for curve
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: #0B0D10F2; display: flex; align-items: center; gap: 12px; padding: 0 14px;">
      <button type="button" aria-label="Menu" style="width: 74px; height: 74px; border-radius: 18px; border: 0; background: #1F2328; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"></path></svg></button>
      <div style="height: 74px; border-radius: 18px; background: #1F2328; display: flex; align-items: center; gap: 4px; padding: 0 6px;">
        <button type="button" aria-label="Lower max speed" style="font-family: inherit; width: 52px; height: 62px; border: 0; background: transparent; color: #F2F5F9; font-size: 28px;">−</button>
        <div style="width: 70px; display: flex; flex-direction: column; align-items: center; line-height: 1;">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #7DBBF9;">MAX</span>
          <span style="font-size: 30px; font-weight: 800; margin-top: 3px;">63</span>
        </div>
        <button type="button" aria-label="Raise max speed" style="font-family: inherit; width: 52px; height: 62px; border: 0; background: transparent; color: #F2F5F9; font-size: 28px;">+</button>
      </div>
      <div role="radiogroup" aria-label="Driving style" style="height: 74px; box-sizing: border-box; border-radius: 18px; background: #1F2328; display: flex; align-items: center; padding: 6px; gap: 2px;">
        <button type="button" role="radio" aria-checked="false" style="font-family: inherit; height: 62px; border: 0; background: transparent; color: #C9D0DA; font-size: 17px; font-weight: 600; padding: 0 18px; border-radius: 14px;">Relaxed</button>
        <button type="button" role="radio" aria-checked="true" style="font-family: inherit; height: 62px; border: 0; background: #5AAAF8; color: #0B1A2B; font-size: 17px; font-weight: 700; padding: 0 18px; border-radius: 14px;">Standard</button>
        <button type="button" role="radio" aria-checked="false" style="font-family: inherit; height: 62px; border: 0; background: transparent; color: #C9D0DA; font-size: 17px; font-weight: 600; padding: 0 18px; border-radius: 14px;">Sport</button>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 12px;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #C9D0DA;">STEERING</span>
        <div style="width: 100%; max-width: 210px; height: 10px; border-radius: 5px; background: #2A2F36; position: relative;">
          <div style="position: absolute; left: 48%; width: 22%; top: 0; bottom: 0; border-radius: 5px; background: #7DBBF9;"></div>
        </div>
      </div>
      <button type="button" aria-label="Disengage" style="width: 74px; height: 74px; border-radius: 18px; border: 0; background: #1F9A55; display: flex; align-items: center; justify-content: center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3.5 10.5h6M14.5 10.5h6M12 14.5V21"></path></svg></button>
    </div>
  </div>
</div>

</body>
</html>
