<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm higher speed limit</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; padding: 10px; font-family: Figtree, system-ui, sans-serif; color: #F2F5F9;">
  <div style="width: 100%; height: 100%; box-sizing: border-box; border: 6px solid #1F9A55; border-radius: 18px; overflow: hidden; position: relative; background: #0F1A24;">
    <svg width="1093" height="531" viewBox="0 0 1093 531" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
      <rect x="0" y="230" width="1093" height="301" fill="#132231"></rect>
      <path d="M520 226 L116 531" stroke="#5C6B7A" stroke-width="5" stroke-linecap="round"></path>
      <path d="M576 226 L984 531" stroke="#5C6B7A" stroke-width="5" stroke-linecap="round"></path>
      <path d="M534 228 L560 228 L729 531 L377 531 Z" fill="#3A73B3" fill-opacity="0.55"></path>
      <path d="M330 424 Q546 392 762 424" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10" fill="none" stroke-linecap="round"></path>
      <path d="M330 424 Q546 392 762 424" pathLength="100" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="14 200" stroke-dashoffset="-50"></path>
    </svg>
    <div style="position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: #0B0D10E6; border-radius: 22px; padding: 10px 40px; display: flex; flex-direction: column; align-items: center; line-height: 1;">
      <span style="font-size: 62px; font-weight: 800;">45</span>
      <span style="font-size: 17px; color: #C9D0DA;">mph</span>
    </div>
    <div style="position: absolute; left: 16px; top: 16px; width: 360px; box-sizing: border-box; background: #16191DF5; border: 2px solid #5AAAF8; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="width: 70px; height: 86px; box-sizing: border-box; border-radius: 9px; background: #FFFFFF; border: 3px solid #0B0D10; outline: 2px solid #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B0D10; line-height: 1; flex-shrink: 0;">
          <span style="font-size: 11px; font-weight: 800;">SPEED</span>
          <span style="font-size: 11px; font-weight: 800;">LIMIT</span>
          <span style="font-size: 34px; font-weight: 800; margin-top: 2px;">55</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 22px; font-weight: 800;">New limit 55</span>
          <span style="font-size: 16px; color: #C9D0DA;">Speed up to 58 mph?</span>
          <span style="font-size: 13px; color: #8FA0B5;">From map · ignored in 8 s</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <button type="button" style="font-family: inherit; height: 60px; border: 0; border-radius: 16px; background: #23272E; color: #F2F5F9; font-size: 18px; font-weight: 700;">Ignore</button>
        <button type="button" style="font-family: inherit; height: 60px; border: 0; border-radius: 16px; background: #5AAAF8; color: #0B1A2B; font-size: 18px; font-weight: 800;">Match</button>
      </div>
      <div style="height: 4px; border-radius: 2px; background: #2A2F36;"><div style="width: 60%; height: 4px; border-radius: 2px; background: #5AAAF8;"></div></div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: linear-gradient(to bottom, #0B0D1000, #0B0D108C); display: flex; align-items: center; gap: 12px; padding: 0 14px;">
      <button type="button" aria-label="Menu" style="width: 74px; height: 74px; border-radius: 18px; border: 0; background: #1F2328CC; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"></path></svg></button>
      <div style="height: 74px; border-radius: 18px; background: #1F2328CC; display: flex; align-items: center; gap: 4px; padding: 0 6px;">
        <button type="button" aria-label="Lower max speed" style="font-family: inherit; width: 52px; height: 62px; border: 0; background: transparent; color: #F2F5F9; font-size: 28px;">−</button>
        <div style="width: 70px; display: flex; flex-direction: column; align-items: center; line-height: 1;">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #7DBBF9;">MAX</span>
          <span style="font-size: 30px; font-weight: 800; margin-top: 3px;">48</span>
        </div>
        <button type="button" aria-label="Raise max speed" style="font-family: inherit; width: 52px; height: 62px; border: 0; background: transparent; color: #F2F5F9; font-size: 28px;">+</button>
      </div>
      <span style="flex-grow: 1; font-size: 15px; color: #8FA0B5; padding-left: 8px;">Lower limits apply without asking. Resume on the wheel also matches.</span>
      <button type="button" aria-label="Disengage" style="width: 74px; height: 74px; border-radius: 18px; border: 0; background: #1F9A55; display: flex; align-items: center; justify-content: center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3.5 10.5h6M14.5 10.5h6M12 14.5V21"></path></svg></button>
    </div>
  </div>
</div>

</body>
</html>
