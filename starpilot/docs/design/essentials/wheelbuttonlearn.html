<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assign a wheel button</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #050608; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative;">
  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 18px; height: 60px; border-radius: 22px; background: #0C0E11;"></div>
  <section aria-label="Assign a wheel button" style="position: relative; height: 470px; box-sizing: border-box; background: #16191D; border-radius: 26px 26px 0 0; border-top: 1px solid #262B33; padding: 14px 22px 20px; display: flex; flex-direction: column; gap: 14px;">
    <div style="align-self: center; width: 64px; height: 6px; border-radius: 3px; background: #3A414C;"></div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 style="margin: 0; flex-grow: 1; font-size: 28px; font-weight: 800;">Assign a button</h2>
      <a href="bluetoothtab.html" style="text-decoration: none; height: 56px; padding: 0 22px; border-radius: 16px; background: #23272E; color: #F2F5F9; font-size: 17px; font-weight: 700; display: flex; align-items: center;">Cancel</a>
      <a href="bluetoothtab.html" style="text-decoration: none; height: 56px; padding: 0 28px; border-radius: 16px; background: #5AAAF8; color: #0B1A2B; font-size: 17px; font-weight: 800; display: flex; align-items: center;">Save</a>
    </div>
    <div style="flex-grow: 1; display: flex; gap: 16px; min-height: 0;">
      <div style="width: 280px; flex-shrink: 0; background: #13221A; border: 1px solid #1F5A3A; border-radius: 20px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #6FD8A0;">STEP 1 · PRESS IT</span>
        <div style="width: 64px; height: 64px; border-radius: 32px; background: #1B3A28; display: flex; align-items: center; justify-content: center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></div>
        <span style="font-size: 22px; font-weight: 800;">Button 5 detected</span>
        <span style="font-size: 15px; color: #C9D8D0; line-height: 1.4;">Press a different button on the remote to change it.</span>
        <div style="flex-grow: 1;"></div>
        <span style="font-size: 13px; color: #8FA0B5;">Listening stops after 20 s.</span>
      </div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #7DBBF9;">STEP 2 · CHOOSE WHAT IT DOES</span>
        <div role="radiogroup" aria-label="Button action" style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 16px; background: #1E2227; color: #F2F5F9; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h6"></path></svg>Change driving style</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 16px; background: #1E2227; color: #F2F5F9; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>Screen off / on</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 16px; background: #1E2227; color: #F2F5F9; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path></svg>Set speed to…</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 16px; background: #1E2227; color: #F2F5F9; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Save a clip</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 16px; background: #1E2227; color: #F2F5F9; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg>Navigate to favorite</button>
          <button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 2px solid #5AAAF8; border-radius: 16px; background: #182434; color: #F2F5F9; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 700;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3.5 10.5h6M14.5 10.5h6M12 14.5V21"></path></svg>Always-on steering</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 16px; background: #1E2227; color: #F2F5F9; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h14M13 8l4 4-4 4M21 6v12"></path></svg>Coast</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 16px; background: #1E2227; color: #F2F5F9; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>Engage</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 16px; background: #1E2227; color: #F2F5F9; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; font-size: 16px; font-weight: 600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2A7B1" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>Disengage</button>
        </div>
        <span style="font-size: 14px; color: #8FA0B5;">Pulse and glide and driver selfie are in Tuner Mode.</span>
      </div>
    </div>
  </section>
</div>

</body>
</html>
