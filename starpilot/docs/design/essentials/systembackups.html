<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backups</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-grow: 1; display: flex; gap: 18px; padding: 18px 20px 14px; min-height: 0;">
    <div style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 8px;">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 1.8px; color: #7DBBF9; padding: 0 16px 8px;">SYSTEM</span>
      <a href="system.html" style="text-decoration: none; height: 56px; border-radius: 14px; color: #C9D0DA; font-size: 18px; font-weight: 600; padding: 0 16px; display: flex; align-items: center;">General</a>
      <a href="systembackups.html" aria-current="page" style="text-decoration: none; height: 56px; border-radius: 14px; background: #1F2E45; color: #F2F5F9; font-size: 18px; font-weight: 600; padding: 0 16px; display: flex; align-items: center;">Backups</a>
      <a href="systemstorage.html" style="text-decoration: none; height: 56px; border-radius: 14px; color: #C9D0DA; font-size: 18px; font-weight: 600; padding: 0 16px; display: flex; align-items: center;">Storage &amp; Data</a>
      <a href="systemreport.html" style="text-decoration: none; height: 56px; border-radius: 14px; color: #C9D0DA; font-size: 18px; font-weight: 600; padding: 0 16px; display: flex; align-items: center;">Report a Problem</a>
    </div>
    <div style="flex-grow: 1; min-width: 0; background: #16191D; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 14px 12px 22px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;"><h2 style="margin: 0; font-size: 24px; font-weight: 700;">Backups</h2><span style="font-size: 14px; color: #AEB6C2;">Snapshots of your StarPilot settings. Drives aren't included.</span></div>
        <button type="button" style="font-family: inherit; height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: #5AAAF8; color: #0B1A2B; font-size: 16px; font-weight: 700;">Back up now</button>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 16px 0 22px; height: 64px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 18px; font-weight: 600;">Automatic</span><span style="font-size: 14px; color: #AEB6C2;">Also saves one before every update</span></div>
        <div role="radiogroup" aria-label="Automatic backups" style="display: flex; background: #23272E; border-radius: 13px; padding: 4px;">
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 40px; padding: 0 14px; border-radius: 10px; font-size: 15px; font-weight: 600;">Off</button>
          <button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 0; background: #5AAAF8; color: #0B1A2B; height: 40px; padding: 0 14px; border-radius: 10px; font-size: 15px; font-weight: 700;">Weekly</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 40px; padding: 0 14px; border-radius: 10px; font-size: 15px; font-weight: 600;">Monthly</button>
        </div>
      </div>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #8FA0B5; padding: 12px 22px 4px;">SAVED</span>
      <div style="display: flex; align-items: center; gap: 14px; padding: 0 12px 0 22px; height: 60px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">[Date]</span><span style="font-size: 14px; color: #AEB6C2;">Weekly</span></div>
        <button type="button" style="font-family: inherit; height: 42px; padding: 0 16px; border: 0; border-radius: 12px; background: #23272E; color: #F2F5F9; font-size: 15px; font-weight: 600;">Restore</button>
        <button type="button" aria-label="Delete backup" style="width: 42px; height: 42px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB6C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 0 12px 0 22px; height: 60px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">[Date]</span><span style="font-size: 14px; color: #AEB6C2;">Before update to [version]</span></div>
        <button type="button" style="font-family: inherit; height: 42px; padding: 0 16px; border: 0; border-radius: 12px; background: #23272E; color: #F2F5F9; font-size: 15px; font-weight: 600;">Restore</button>
        <button type="button" aria-label="Delete backup" style="width: 42px; height: 42px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB6C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 0 12px 0 22px; height: 60px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">[Backup name]</span><span style="font-size: 14px; color: #AEB6C2;">Manual · [date]</span></div>
        <button type="button" style="font-family: inherit; height: 42px; padding: 0 16px; border: 0; border-radius: 12px; background: #23272E; color: #F2F5F9; font-size: 15px; font-weight: 600;">Restore</button>
        <button type="button" aria-label="Delete backup" style="width: 42px; height: 42px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB6C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
      </div>
    </div>
  </div>
  <nav style="height: 102px; flex-shrink: 0; border-top: 1px solid #1F242B; background: #0E1013; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
    <a href="hub.html" aria-label="Back" style="width: 74px; height: 74px; border-radius: 18px; background: #1F2328; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <button type="button" style="font-family: inherit; height: 74px; padding: 0 32px; border-radius: 18px; border: 0; background: #5AAAF8; color: #0B1A2B; font-size: 18px; font-weight: 700;">StarPilot</button>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <a href="devicetab.html" style="text-decoration: none; height: 74px; color: #C9D0DA; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Device</a>
      <a href="networktab.html" style="text-decoration: none; height: 74px; color: #C9D0DA; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Network</a>
      <a href="bluetoothtab.html" style="text-decoration: none; height: 74px; color: #C9D0DA; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Bluetooth</a>
      <a href="softwaretab.html" style="text-decoration: none; height: 74px; color: #C9D0DA; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Software</a>
    </div>
  </nav>
</div>

</html>
