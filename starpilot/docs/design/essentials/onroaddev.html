<!doctype html>
<html lang="en">
<head>

<title>Onroad developer view</title>

<body>


<link rel="preconnect" href="https://fonts.googleapis.com">

</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; padding: 10px; font-family: Figtree, system-ui, sans-serif; color: #F2F5F9; display: flex; gap: 10px;">

      <path d="M417 290 L405 304 L429 304 Z" fill="#E9B44C"></path>
    </svg>
    <div style="position: absolute; left: 50%; top: 176px; transform: translateX(-50%); background: #0B0D10F0; border: 1px solid #343B45; border-radius: 12px; padding: 6px 12px; display: flex; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; white-space: nowrap;">
      <span>38 m</span><span style="color: #9FAABA;">1.4 s</span><span style="color: #F0B35A;">−2 mph</span>
    </div>
    <div style="position: absolute; left: 14px; top: 14px; width: 66px; height: 80px; box-sizing: border-box; border-radius: 8px; background: #FFFFFF; border: 3px solid #0B0D10; outline: 2px solid #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B0D10; line-height: 1;">
      <span style="font-size: 9px; font-weight: 800;">SPEED</span>
      <span style="font-size: 9px; font-weight: 800;">LIMIT</span>
      <span style="font-size: 28px; font-weight: 800; margin-top: 2px;">60</span>
      <span style="font-size: 9px; font-weight: 700; margin-top: 2px; color: #3A4552;">MAP · +3</span>
    </div>
    <div style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #0B0D10E6; border-radius: 20px; padding: 8px 32px; display: flex; flex-direction: column; align-items: center; line-height: 1;">
      <span style="font-size: 52px; font-weight: 800;">62</span>
      <span style="font-size: 15px; color: #C9D0DA;">mph</span>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 84px; height: 30px; background: #0B0D10CC; display: flex; align-items: center; justify-content: space-around; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #C9D0DA;">

        <div style="width: 60px; display: flex; flex-direction: column; align-items: center; line-height: 1;">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #7DBBF9;">MAX</span>
          <span style="font-size: 27px; font-weight: 800; margin-top: 3px;">63</span>
        </div>
        <button type="button" aria-label="Raise max speed" style="font-family: inherit; width: 46px; height: 56px; border: 0; background: transparent; color: #F2F5F9; font-size: 26px;">+</button>
      </div>
      <div style="flex-grow: 1; min-width: 0; height: 66px; border-radius: 16px; background: #1F2328; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 20px;">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
      <div style="background: #1E2227; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 11px; color: #9FAABA;">distance</span><span style="font-size: 18px; font-weight: 700;">38 m</span></div>
      <div style="background: #1E2227; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 11px; color: #9FAABA;">gap</span><span style="font-size: 18px; font-weight: 700;">1.4 s</span></div>
      <div style="background: #1E2227; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 11px; color: #9FAABA;">rel speed</span><span style="font-size: 18px; font-weight: 700; color: #F0B35A;">−2 mph</span></div>
      <div style="background: #1E2227; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 11px; color: #9FAABA;">source</span><span style="font-size: 18px; font-weight: 700;">radar</span></div>
    </div>
    <span style="font-family: Figtree, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #7DBBF9; margin-top: 6px;">DEVICE</span>
    <div style="display: flex; flex-direction: column; gap: 7px; font-size: 14px;">
      <div style="display: flex; justify-content: space-between;"><span style="color: #9FAABA;">CPU</span><span>38% · 61°C</span></div>
      <div style="height: 5px; border-radius: 3px; background: #2A2F36;"><div style="width: 38%; height: 5px; border-radius: 3px; background: #7DBBF9;"></div></div>
      <div style="display: flex; justify-content: space-between;"><span style="color: #9FAABA;">GPU</span><span>22%</span></div>
      <div style="height: 5px; border-radius: 3px; background: #2A2F36;"><div style="width: 22%; height: 5px; border-radius: 3px; background: #7DBBF9;"></div></div>
      <div style="display: flex; justify-content: space-between;"><span style="color: #9FAABA;">RAM</span><span>3.1 GB</span></div>
      <div style="height: 5px; border-radius: 3px; background: #2A2F36;"><div style="width: 52%; height: 5px; border-radius: 3px; background: #7DBBF9;"></div></div>

    <div style="display: flex; flex-direction: column; gap: 7px; font-size: 14px;">
      <div style="display: flex; justify-content: space-between;"><span style="color: #9FAABA;">curve spd</span><span>idle</span></div>
      <div style="display: flex; justify-content: space-between;"><span style="color: #9FAABA;">limit src</span><span>map</span></div>
      <div style="display: flex; justify-content: space-between;"><span style="color: #9FAABA;">lanes L/R</span><span>3.6 / 3.5 m</span></div>
    </div>
