<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>System settings</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-grow: 1; display: flex; gap: 18px; padding: 18px 20px 14px; min-height: 0;">
    <div style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 8px;">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 1.8px; color: #7DBBF9; padding: 0 16px 8px;">SYSTEM</span>
      <button type="button" style="font-family: inherit; text-align: left; height: 56px; border: 0; border-radius: 14px; background: #1F2E45; color: #F2F5F9; font-size: 18px; font-weight: 600; padding: 0 16px;">General</button>
      <button type="button" style="font-family: inherit; text-align: left; height: 56px; border: 0; border-radius: 14px; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600; padding: 0 16px;">Backups</button>
      <button type="button" style="font-family: inherit; text-align: left; height: 56px; border: 0; border-radius: 14px; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600; padding: 0 16px;">Storage &amp; Data</button>
      <button type="button" style="font-family: inherit; text-align: left; height: 56px; border: 0; border-radius: 14px; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600; padding: 0 16px;">Report a Problem</button>
    </div>
    <div style="flex-grow: 1; min-width: 0; background: #16191D; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden;">
      <div style="padding: 16px 22px 12px; border-bottom: 1px solid #23272E;"><h2 style="margin: 0; font-size: 24px; font-weight: 700;">General</h2></div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 16px 0 22px; height: 60px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 19px; font-weight: 600;">Units</span><span style="font-size: 14px; color: #AEB6C2;">Speed and distance everywhere</span></div>
        <div role="radiogroup" aria-label="Units" style="display: flex; background: #23272E; border-radius: 13px; padding: 4px;">
          <button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 0; background: #5AAAF8; color: #0B1A2B; height: 42px; padding: 0 16px; border-radius: 10px; font-size: 16px; font-weight: 700;">mph</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 42px; padding: 0 16px; border-radius: 10px; font-size: 16px; font-weight: 600;">km/h</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 12px 0 22px; height: 60px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 19px; font-weight: 600;">Language</span></div>
        <button type="button" style="font-family: inherit; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 18px; border: 0; border-radius: 12px; background: #23272E; color: #F2F5F9; font-size: 17px; font-weight: 700;">English <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 16px 0 22px; height: 60px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 19px; font-weight: 600;">Screen Brightness</span><span style="font-size: 14px; color: #AEB6C2;">Auto follows ambient light, day and night</span></div>
        <div role="radiogroup" aria-label="Brightness" style="display: flex; background: #23272E; border-radius: 13px; padding: 4px;">
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 42px; padding: 0 14px; border-radius: 10px; font-size: 16px; font-weight: 600;">Dimmer</button>
          <button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 0; background: #5AAAF8; color: #0B1A2B; height: 42px; padding: 0 14px; border-radius: 10px; font-size: 16px; font-weight: 700;">Auto</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 42px; padding: 0 14px; border-radius: 10px; font-size: 16px; font-weight: 600;">Brighter</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 22px; height: 60px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 19px; font-weight: 600;">Standby</span><span style="font-size: 14px; color: #AEB6C2;">Screen sleeps while driving, wakes for alerts</span></div>
        <button type="button" role="switch" aria-checked="true" aria-label="Standby" style="width: 72px; height: 42px; border-radius: 21px; border: 0; background: #5AAAF8; padding: 4px; display: flex; justify-content: flex-end;"><span style="width: 34px; height: 34px; border-radius: 17px; background: #0E1520; display: block;"></span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 16px 0 22px; height: 60px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 19px; font-weight: 600;">Uploads</span><span style="font-size: 14px; color: #AEB6C2;">Drive logs and video for debugging</span></div>
        <div role="radiogroup" aria-label="Uploads" style="display: flex; background: #23272E; border-radius: 13px; padding: 4px;">
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 42px; padding: 0 14px; border-radius: 10px; font-size: 16px; font-weight: 600;">Off</button>
          <button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 0; background: #5AAAF8; color: #0B1A2B; height: 42px; padding: 0 14px; border-radius: 10px; font-size: 16px; font-weight: 700;">Wi-Fi only</button>
          <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 42px; padding: 0 14px; border-radius: 10px; font-size: 16px; font-weight: 600;">Always</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 12px 0 22px; height: 60px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 19px; font-weight: 600;">Automatic Backups</span><span style="font-size: 14px; color: #AEB6C2;">Settings snapshot every week, last [date]</span></div>
        <button type="button" style="font-family: inherit; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 18px; border: 0; border-radius: 12px; background: #23272E; color: #F2F5F9; font-size: 17px; font-weight: 700;">Weekly <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
    </div>
  </div>
  <nav style="height: 102px; flex-shrink: 0; border-top: 1px solid #1F242B; background: #0E1013; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
    <a href="hub.html" aria-label="Back" style="width: 74px; height: 74px; border-radius: 18px; background: #1F2328; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <button type="button" style="font-family: inherit; height: 74px; padding: 0 32px; border-radius: 18px; border: 0; background: #5AAAF8; color: #0B1A2B; font-size: 18px; font-weight: 700;">StarPilot</button>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Device</button>
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Network</button>
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Bluetooth</button>
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Software</button>
    </div>
  </nav>
</div>

</body>
</html>
