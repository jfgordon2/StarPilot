<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm dialogs</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #050608; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; position: relative; overflow: hidden;">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 18px 20px; display: flex; gap: 18px; opacity: 0.35;">
    <div style="width: 300px; display: flex; flex-direction: column; gap: 8px; padding-top: 30px;">
      <div style="height: 56px; border-radius: 14px; background: #1F2E45;"></div>
      <div style="height: 56px; border-radius: 14px; background: #16191D;"></div>
      <div style="height: 56px; border-radius: 14px; background: #16191D;"></div>
    </div>
    <div style="flex-grow: 1; border-radius: 22px; background: #16191D;"></div>
  </div>
  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; padding: 40px 36px; align-items: center;">
    <section role="dialog" aria-label="Delete driving data" style="background: #1A1D22; border: 1px solid #2A2F36; border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 18px;">
      <div style="width: 60px; height: 60px; border-radius: 18px; background: #3A2026; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2A7B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0; font-size: 26px; font-weight: 800;">Delete all driving data?</h2>
        <span style="font-size: 17px; color: #C9D0DA; line-height: 1.4;">Removes every recorded drive and its video from this device. This can't be undone.</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 6px;">
        <button type="button" style="font-family: inherit; height: 64px; border: 0; border-radius: 16px; background: #2A2F36; color: #F2F5F9; font-size: 19px; font-weight: 700;">Cancel</button>
        <button type="button" style="font-family: inherit; height: 64px; border: 0; border-radius: 16px; background: #C8404D; color: #FFFFFF; font-size: 19px; font-weight: 800;">Delete</button>
      </div>
    </section>
    <section role="dialog" aria-label="Reboot to apply" style="background: #1A1D22; border: 1px solid #2A2F36; border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 18px;">
      <div style="width: 60px; height: 60px; border-radius: 18px; background: #1F2E45; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg></div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0; font-size: 26px; font-weight: 800;">Restart to apply</h2>
        <span style="font-size: 17px; color: #C9D0DA; line-height: 1.4;">The new steering controller loads on restart. If you choose Later, it applies next time you start the car.</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 6px;">
        <button type="button" style="font-family: inherit; height: 64px; border: 0; border-radius: 16px; background: #2A2F36; color: #F2F5F9; font-size: 19px; font-weight: 700;">Later</button>
        <button type="button" style="font-family: inherit; height: 64px; border: 0; border-radius: 16px; background: #5AAAF8; color: #0B1A2B; font-size: 19px; font-weight: 800;">Restart now</button>
      </div>
    </section>
  </div>
</div>

</body>
</html>
