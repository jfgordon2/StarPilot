<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice typing: listening</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 10px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="destinations.html" aria-label="Back" style="width: 56px; height: 56px; border-radius: 14px; background: #1F2328; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <label style="flex-grow: 1; height: 56px; box-sizing: border-box; border-radius: 14px; background: #1A1D22; border: 2px solid #5AAAF8; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB6C2" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Search destination</span>
        <input type="text" value="" placeholder="Search destination" style="flex-grow: 1; border: 0; background: transparent; color: #F2F5F9; font-family: inherit; font-size: 20px; outline: none;">
        <button type="button" aria-label="Clear" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: #2A2F36; display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </label>
    </div>
  </div>
  <div role="group" aria-label="Voice typing" style="flex-grow: 1; background: #13161A; border-top: 1px solid #1F242B; padding: 22px 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; position: relative;">
    <button type="button" aria-label="Stop listening" style="width: 132px; height: 132px; border-radius: 66px; display: flex; align-items: center; justify-content: center; border: 0; background: #5AAAF8; box-shadow: 0 0 0 14px rgba(90,170,248,0.18), 0 0 0 28px rgba(90,170,248,0.08);"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#0B1A2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <span style="font-size: 26px; font-weight: 800;">Listening</span>
      <span style="font-size: 16px; color: #AEB6C2;">Say a place or an address. Tap the mic when you're done.</span>
    </div>
    <div aria-hidden="true" style="height: 80px; display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 10px; border-radius: 4px; background: #5AAAF8; opacity: 0.61;"></span><span style="width: 8px; height: 16px; border-radius: 4px; background: #5AAAF8; opacity: 0.64;"></span><span style="width: 8px; height: 24px; border-radius: 4px; background: #5AAAF8; opacity: 0.69;"></span><span style="width: 8px; height: 34px; border-radius: 4px; background: #5AAAF8; opacity: 0.74;"></span><span style="width: 8px; height: 46px; border-radius: 4px; background: #5AAAF8; opacity: 0.81;"></span><span style="width: 8px; height: 40px; border-radius: 4px; background: #5AAAF8; opacity: 0.78;"></span><span style="width: 8px; height: 58px; border-radius: 4px; background: #5AAAF8; opacity: 0.88;"></span><span style="width: 8px; height: 72px; border-radius: 4px; background: #5AAAF8; opacity: 0.96;"></span><span style="width: 8px; height: 64px; border-radius: 4px; background: #5AAAF8; opacity: 0.91;"></span><span style="width: 8px; height: 50px; border-radius: 4px; background: #5AAAF8; opacity: 0.83;"></span><span style="width: 8px; height: 80px; border-radius: 4px; background: #5AAAF8; opacity: 1.00;"></span><span style="width: 8px; height: 68px; border-radius: 4px; background: #5AAAF8; opacity: 0.93;"></span><span style="width: 8px; height: 54px; border-radius: 4px; background: #5AAAF8; opacity: 0.85;"></span><span style="width: 8px; height: 44px; border-radius: 4px; background: #5AAAF8; opacity: 0.80;"></span><span style="width: 8px; height: 60px; border-radius: 4px; background: #5AAAF8; opacity: 0.89;"></span><span style="width: 8px; height: 38px; border-radius: 4px; background: #5AAAF8; opacity: 0.76;"></span><span style="width: 8px; height: 28px; border-radius: 4px; background: #5AAAF8; opacity: 0.71;"></span><span style="width: 8px; height: 36px; border-radius: 4px; background: #5AAAF8; opacity: 0.75;"></span><span style="width: 8px; height: 22px; border-radius: 4px; background: #5AAAF8; opacity: 0.67;"></span><span style="width: 8px; height: 16px; border-radius: 4px; background: #5AAAF8; opacity: 0.64;"></span><span style="width: 8px; height: 12px; border-radius: 4px; background: #5AAAF8; opacity: 0.62;"></span><span style="width: 8px; height: 10px; border-radius: 4px; background: #5AAAF8; opacity: 0.61;"></span></div>
    <button type="button" style="position: absolute; left: 24px; bottom: 20px; font-family: inherit; height: 56px; padding: 0 22px; border: 0; border-radius: 14px; background: #23272E; color: #F2F5F9; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"></rect><path d="M6.5 10h1M10 10h1M13.5 10h1M17 10h.5M7 14h10"></path></svg>Type instead</button>
  </div>
</div>

</body>
</html>
