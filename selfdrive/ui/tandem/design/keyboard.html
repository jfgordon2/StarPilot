<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 10px;">
    <div style="display: flex; align-items: center; gap: 12px; height: 56px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; padding: 0 4px;">
        <span style="font-size: 24px; font-weight: 800;">Choose a Galaxy password</span>
        <span style="font-size: 15px; color: #AEB6C2;">At least 6 characters. Galaxy asks for it when you sign in.</span>
      </div>
      <button type="button" style="font-family: inherit; height: 56px; padding: 0 24px; border: 0; border-radius: 14px; background: #23272E; color: #F2F5F9; font-size: 17px; font-weight: 700;">Cancel</button>
    </div>
    <label style="height: 56px; box-sizing: border-box; border-radius: 14px; background: #1A1D22; border: 2px solid #5AAAF8; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px;">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Password</span>
      <input type="password" value="tandem" style="flex-grow: 1; border: 0; background: transparent; color: #F2F5F9; font-family: inherit; font-size: 20px; outline: none; letter-spacing: 2px;">
      <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#AEB6C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
    </label>
  </div>
  <div role="group" aria-label="Keyboard" style="flex-grow: 1; background: #13161A; border-top: 1px solid #1F242B; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; flex-grow: 1;">
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">q</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">w</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">e</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">r</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">t</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">y</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">u</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">i</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">o</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">p</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; flex-grow: 1; padding: 0 3%;">
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">a</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">s</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">d</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">f</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">g</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">h</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">j</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">k</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">l</button>
      <button type="button" aria-label="Backspace" style="font-family: inherit; border: 0; border-radius: 12px; background: #353A43; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; flex-grow: 1;">
      <button type="button" aria-label="Shift" style="font-family: inherit; border: 0; border-radius: 12px; background: #353A43; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 8h-4.5v7h-7v-7H4z"></path></svg></button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">z</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">x</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">c</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">v</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">b</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">n</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">m</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">,</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #F2F5F9; font-size: 24px; font-weight: 500;">.</button>
    </div>
    <div style="display: grid; grid-template-columns: 1.4fr 6fr 2.6fr; gap: 8px; flex-grow: 1;">
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #353A43; color: #F2F5F9; font-size: 18px; font-weight: 600;">123</button>
      <button type="button" aria-label="Space" style="font-family: inherit; border: 0; border-radius: 12px; background: #262A31; color: #8FA0B5; font-size: 16px;">space</button>
      <button type="button" style="font-family: inherit; border: 0; border-radius: 12px; background: #5AAAF8; color: #0B1A2B; font-size: 19px; font-weight: 700;">Set up</button>
    </div>
  </div>
</div>

</body>
</html>
