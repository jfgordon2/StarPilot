<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Path Style picker</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #050608; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative;">
  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 18px; height: 110px; border-radius: 22px; background: #0C0E11;"></div>
  <section aria-label="Path Style" style="position: relative; height: 412px; box-sizing: border-box; background: #16191D; border-radius: 26px 26px 0 0; border-top: 1px solid #262B33; padding: 14px 22px 22px; display: flex; flex-direction: column; gap: 16px;">
    <div style="align-self: center; width: 64px; height: 6px; border-radius: 3px; background: #3A414C;"></div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;"><h2 style="margin: 0; font-size: 28px; font-weight: 800;">Path Style</h2><span style="font-size: 15px; color: #AEB6C2;">Sets path color, width, edges and lane lines together</span></div>
      <a href="display.html" style="text-decoration: none; height: 60px; padding: 0 30px; border-radius: 16px; background: #5AAAF8; color: #0B1A2B; font-size: 18px; font-weight: 800; display: flex; align-items: center;">Done</a>
    </div>
    <div role="radiogroup" aria-label="Path style" style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
      <button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 2px solid #5AAAF8; border-radius: 20px; background: #1E2227; padding: 12px; display: flex; flex-direction: column; gap: 12px; color: #F2F5F9;">
        <svg width="100%" height="150" viewBox="0 0 220 150" preserveAspectRatio="xMidYMid slice" style="border-radius: 12px; background: #132231; display: block;" aria-hidden="true"><path d="M100 10 L30 150" stroke="#5C6B7A" stroke-width="3"></path><path d="M120 10 L190 150" stroke="#5C6B7A" stroke-width="3"></path><path d="M104 10 L116 10 L150 150 L70 150 Z" fill="#3A73B3" fill-opacity="0.65"></path></svg>
        <span style="font-size: 18px; font-weight: 700;">Standard</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 20px; background: #1E2227; padding: 12px; display: flex; flex-direction: column; gap: 12px; color: #F2F5F9;">
        <svg width="100%" height="150" viewBox="0 0 220 150" preserveAspectRatio="xMidYMid slice" style="border-radius: 12px; background: #132231; display: block;" aria-hidden="true"><path d="M100 10 L30 150" stroke="#5C6B7A" stroke-width="2"></path><path d="M120 10 L190 150" stroke="#5C6B7A" stroke-width="2"></path><path d="M108 10 L112 10 L124 150 L96 150 Z" fill="#7DBBF9" fill-opacity="0.8"></path></svg>
        <span style="font-size: 18px; font-weight: 600;">Thin</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 20px; background: #1E2227; padding: 12px; display: flex; flex-direction: column; gap: 12px; color: #F2F5F9;">
        <svg width="100%" height="150" viewBox="0 0 220 150" preserveAspectRatio="xMidYMid slice" style="border-radius: 12px; background: #132231; display: block;" aria-hidden="true"><defs><linearGradient id="rb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E5484D"></stop><stop offset="0.25" stop-color="#F5A524"></stop><stop offset="0.5" stop-color="#F5E06B"></stop><stop offset="0.75" stop-color="#3FD08A"></stop><stop offset="1" stop-color="#5AAAF8"></stop></linearGradient></defs><path d="M100 10 L30 150" stroke="#5C6B7A" stroke-width="3"></path><path d="M120 10 L190 150" stroke="#5C6B7A" stroke-width="3"></path><path d="M104 10 L116 10 L150 150 L70 150 Z" fill="url(#rb)" fill-opacity="0.75"></path></svg>
        <span style="font-size: 18px; font-weight: 600;">Rainbow</span>
      </button>
      <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 2px solid transparent; border-radius: 20px; background: #1E2227; padding: 12px; display: flex; flex-direction: column; gap: 12px; color: #F2F5F9;">
        <svg width="100%" height="150" viewBox="0 0 220 150" preserveAspectRatio="xMidYMid slice" style="border-radius: 12px; background: #132231; display: block;" aria-hidden="true"><defs><linearGradient id="ac" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3FD08A"></stop><stop offset="0.6" stop-color="#3FD08A"></stop><stop offset="1" stop-color="#F0B35A"></stop></linearGradient></defs><path d="M100 10 L30 150" stroke="#5C6B7A" stroke-width="3"></path><path d="M120 10 L190 150" stroke="#5C6B7A" stroke-width="3"></path><path d="M104 10 L116 10 L150 150 L70 150 Z" fill="url(#ac)" fill-opacity="0.6"></path></svg>
        <span style="font-size: 18px; font-weight: 600;">Acceleration</span>
      </button>
    </div>
    <span style="font-size: 14px; color: #8FA0B5;">Acceleration tints the path green when speeding up and amber when slowing. Each value can be changed in Tuner Mode.</span>
  </section>
</div>

</body>
</html>
