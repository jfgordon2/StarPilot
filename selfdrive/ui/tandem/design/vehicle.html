<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vehicle settings</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-grow: 1; display: grid; grid-template-columns: 1fr 1.35fr; gap: 14px; padding: 20px 20px 14px; min-height: 0;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="background: #16191D; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #7DBBF9;">YOUR CAR</span>
        <span style="font-size: 26px; font-weight: 800;">[Year Make Model]</span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #6FD8A0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Detected automatically</span>
        <div style="flex-grow: 1;"></div>
        <a href="vehiclepicker.html" style="font-size: 16px; font-weight: 600;">Wrong car? Choose it manually</a>
      </div>
      <div style="background: #16191D; border-radius: 22px; padding: 0 16px 0 22px; height: 76px; display: flex; align-items: center; gap: 16px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 19px; font-weight: 600;">Auto-Lock Doors</span><span style="font-size: 14px; color: #AEB6C2;">Locks when you shift out of park</span></div>
        <button type="button" role="switch" aria-checked="true" aria-label="Auto-Lock Doors" style="width: 72px; height: 42px; border-radius: 21px; border: 0; background: #5AAAF8; padding: 4px; display: flex; justify-content: flex-end;"><span style="width: 34px; height: 34px; border-radius: 17px; background: #0E1520; display: block;"></span></button>
      </div>
    </div>
    <div style="background: #16191D; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden;">
      <div style="padding: 18px 22px 10px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 20px; font-weight: 700;">Steering Wheel Buttons</span>
        <span style="font-size: 14px; color: #AEB6C2;">Preset for your car. Tap a button to change what it does.</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 0 12px 0 22px; height: 64px; border-top: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 18px; font-weight: 600;">Distance</span><span style="font-size: 14px; color: #AEB6C2;">Press</span></div>
        <button type="button" style="font-family: inherit; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 18px; border: 0; border-radius: 12px; background: #23272E; color: #F2F5F9; font-size: 16px; font-weight: 700;">Change driving style <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 0 12px 0 22px; height: 64px; border-top: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 18px; font-weight: 600;">Distance</span><span style="font-size: 14px; color: #AEB6C2;">Long press</span></div>
        <button type="button" style="font-family: inherit; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 18px; border: 0; border-radius: 12px; background: #23272E; color: #F2F5F9; font-size: 16px; font-weight: 700;">Pause steering <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 0 12px 0 22px; height: 64px; border-top: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 18px; font-weight: 600;">LKAS</span><span style="font-size: 14px; color: #AEB6C2;">Press</span></div>
        <button type="button" style="font-family: inherit; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 18px; border: 0; border-radius: 12px; background: #23272E; color: #F2F5F9; font-size: 16px; font-weight: 700;">Always-on steering <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 0 12px 0 22px; height: 64px; border-top: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 18px; font-weight: 600;">Cruise main</span><span style="font-size: 14px; color: #AEB6C2;">Press</span></div>
        <button type="button" style="font-family: inherit; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 18px; border: 0; border-radius: 12px; background: #23272E; color: #C9D0DA; font-size: 16px; font-weight: 600;">Car default <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9D0DA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
    </div>
  </div>
  <nav style="height: 102px; flex-shrink: 0; border-top: 1px solid #1F242B; background: #0E1013; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
    <a href="hub.html" aria-label="Back" style="width: 74px; height: 74px; border-radius: 18px; background: #1F2328; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <button type="button" style="font-family: inherit; height: 74px; padding: 0 32px; border-radius: 18px; border: 0; background: #5AAAF8; color: #0B1A2B; font-size: 18px; font-weight: 700;">Driving</button>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Device</button>
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Network</button>
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Bluetooth</button>
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Software</button>
    </div>
  </nav>
</div>

</body>
</html>
