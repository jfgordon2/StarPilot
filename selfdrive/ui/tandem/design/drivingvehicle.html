<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vehicle Profile</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-grow: 1; display: flex; gap: 18px; padding: 18px 20px 14px; min-height: 0;">
    <div style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 8px;">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 1.8px; color: #7DBBF9; padding: 0 16px 8px;">SPEED &amp; STEERING</span>
      <a href="driving.html" style="text-decoration: none; height: 56px; border-radius: 14px; color: #C9D0DA; font-size: 18px; font-weight: 600; padding: 0 16px; display: flex; align-items: center;">Everyday</a>
      <a href="drivingvehicle.html" aria-current="page" style="text-decoration: none; height: 56px; border-radius: 14px; background: #1F2E45; color: #F2F5F9; font-size: 18px; font-weight: 600; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;">Vehicle Profile <span style="font-size: 15px; color: #AEB6C2; font-weight: 500;">Car</span></a>
      <a href="drivingweather.html" style="text-decoration: none; height: 56px; border-radius: 14px; color: #C9D0DA; font-size: 18px; font-weight: 600; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;">Weather <span style="font-size: 15px; color: #8FA0B5; font-weight: 500;">Auto</span></a>
      <a href="drivingnav.html" style="text-decoration: none; height: 56px; border-radius: 14px; color: #C9D0DA; font-size: 18px; font-weight: 600; padding: 0 16px; display: flex; align-items: center;">Navigation</a>
    </div>
    <div style="flex-grow: 1; min-width: 0; background: #16191D; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; padding: 16px 18px; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 3px; padding: 0 4px;">
        <h2 style="margin: 0; font-size: 24px; font-weight: 700;">Vehicle Profile</h2>
        <span style="font-size: 14px; color: #AEB6C2;">Adjusts acceleration and braking for what you drive</span>
      </div>
      <div role="radiogroup" aria-label="Vehicle profile" style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <button type="button" role="radio" aria-checked="true" style="font-family: inherit; text-align: left; border: 2px solid #5AAAF8; border-radius: 18px; background: #182434; color: #F2F5F9; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 21px; font-weight: 800;">Car</span><span style="font-size: 14px; color: #C9D8EA;">Standard tuning for most cars and SUVs</span></button>
        <button type="button" role="radio" aria-checked="false" style="font-family: inherit; text-align: left; border: 2px solid transparent; border-radius: 18px; background: #1E2227; color: #F2F5F9; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 21px; font-weight: 800;">EV</span><span style="font-size: 14px; color: #AEB6C2;">Smoother take-off and regen-aware braking</span></button>
        <button type="button" role="radio" aria-checked="false" style="font-family: inherit; text-align: left; border: 2px solid transparent; border-radius: 18px; background: #1E2227; color: #F2F5F9; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 21px; font-weight: 800;">Truck</span><span style="font-size: 14px; color: #AEB6C2;">Gentler acceleration for heavier vehicles</span></button>
        <button type="button" role="radio" aria-checked="false" style="font-family: inherit; text-align: left; border: 2px solid transparent; border-radius: 18px; background: #1E2227; color: #F2F5F9; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 21px; font-weight: 800;">Towing</span><span style="font-size: 14px; color: #AEB6C2;">Truck tuning plus room for a trailer</span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 6px; height: 54px; border-top: 1px solid #23272E; opacity: 0.5;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 17px; font-weight: 600;">Trailer Load</span><span style="font-size: 14px; color: #AEB6C2;">Available with Towing</span></div>
        <div role="radiogroup" aria-label="Trailer load" style="display: flex; background: #23272E; border-radius: 12px; padding: 3px;">
          <button type="button" role="radio" aria-checked="false" disabled="disabled" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 38px; padding: 0 14px; border-radius: 9px; font-size: 15px; font-weight: 600;">Light</button>
          <button type="button" role="radio" aria-checked="true" disabled="disabled" style="font-family: inherit; border: 0; background: #3A414C; color: #F2F5F9; height: 38px; padding: 0 14px; border-radius: 9px; font-size: 15px; font-weight: 700;">Medium</button>
          <button type="button" role="radio" aria-checked="false" disabled="disabled" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 38px; padding: 0 14px; border-radius: 9px; font-size: 15px; font-weight: 600;">Heavy</button>
        </div>
      </div>
    </div>
  </div>
  <nav style="height: 102px; flex-shrink: 0; border-top: 1px solid #1F242B; background: #0E1013; display: flex; align-items: center; gap: 10px; padding: 0 16px;">

    <button type="button" style="font-family: inherit; height: 74px; padding: 0 32px; border-radius: 18px; border: 0; background: #5AAAF8; color: #0B1A2B; font-size: 18px; font-weight: 700;">Driving</button>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <a href="devicetab.html" style="text-decoration: none; height: 74px; color: #C9D0DA; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Device</a>
      <a href="networktab.html" style="text-decoration: none; height: 74px; color: #C9D0DA; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Network</a>
      <a href="bluetoothtab.html" style="text-decoration: none; height: 74px; color: #C9D0DA; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Bluetooth</a>
      <a href="softwaretab.html" style="text-decoration: none; height: 74px; color: #C9D0DA; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Software</a>
    </div>
  </nav>
</div>
