<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driver camera</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; position: relative; overflow: hidden; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; background: radial-gradient(ellipse at 50% 55%, #2B3036 0%, #15181C 55%, #0A0C0F 100%);">
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 150px; width: 170px; height: 210px; transform: translateX(-50%); border-radius: 50% 50% 46% 46%; background: #3A4048;"></div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 330px; width: 380px; height: 260px; transform: translateX(-50%); border-radius: 50% 50% 0 0; background: #30353C;"></div>
  <div aria-label="Your face" style="position: absolute; left: 50%; top: 195px; width: 120px; height: 120px; transform: translateX(-50%); box-sizing: border-box; border: 3px solid #3FD08A; border-radius: 18px;"></div>
  <a href="devicetab.html" aria-label="Back" style="position: absolute; left: 18px; top: 18px; width: 74px; height: 74px; border-radius: 18px; background: #1F2328CC; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
  <div style="position: absolute; left: 50%; top: 18px; transform: translateX(-50%); height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-radius: 16px; background: #13301FE6; color: #D2F5E1; font-size: 18px; font-weight: 600;">
    <span style="width: 12px; height: 12px; border-radius: 6px; background: #3FD08A; display: block;"></span>Face found · driver monitoring can see you
  </div>
  <div aria-label="Driver monitoring: attentive" style="position: absolute; right: 18px; top: 18px; width: 64px; height: 64px; border-radius: 14px; background: #0B0D10; display: flex; align-items: center; justify-content: center;">
    <div style="width: 50px; height: 50px; box-sizing: border-box; border-radius: 50%; border: 3px solid #3FD08A; display: flex; align-items: center; justify-content: center;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M5 20.5a7 7 0 0 1 14 0"></path></svg>
    </div>
  </div>
  <div style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-radius: 16px; background: #0B0D10E6; color: #C9D0DA; font-size: 17px;">
    Sit as you do to drive. The box should follow your face.
  </div>
</div>
