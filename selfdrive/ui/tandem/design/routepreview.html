<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Route preview</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-grow: 1; display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; padding: 20px 20px 14px; min-height: 0;">
    <div style="background: #16191D; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <span style="width: 60px; height: 60px; border-radius: 16px; background: #1F2E45; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;"><span style="font-size: 30px; font-weight: 800;">[Destination name]</span><span style="font-size: 16px; color: #AEB6C2;">[Street address, city]</span></div>
      </div>
      <div style="flex-grow: 1;"></div>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #8FA0B5;">ON THE WAY</span>
      <span style="display: flex; align-items: center; gap: 10px; font-size: 16px; color: #C9D0DA;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Slows ahead of turns on the route</span>
      <span style="display: flex; align-items: center; gap: 10px; font-size: 16px; color: #C9D0DA;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Uses route speed limits when signs are missing</span>
      <span style="display: flex; align-items: center; gap: 10px; font-size: 16px; color: #C9D0DA;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Arrival time and what's left show in the bar</span>
    </div>
    <div style="background: #16191D; border-radius: 22px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #7DBBF9;">SAVE THIS PLACE</span>
        <button type="button" aria-pressed="true" style="font-family: inherit; color: inherit; text-align: left; height: 66px; box-sizing: border-box; border-radius: 16px; border: 2px solid #5AAAF8; background: #182434; display: flex; align-items: center; gap: 14px; padding: 0 16px;">
          <span style="width: 42px; height: 42px; border-radius: 12px; background: #1F2E45; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></span>
          <span style="flex-grow: 1; font-size: 18px; font-weight: 700;">Favorite</span><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: #7DBBF9;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Saved</span>
        </button>
        <button type="button" aria-pressed="false" style="font-family: inherit; color: inherit; text-align: left; height: 66px; box-sizing: border-box; border-radius: 16px; border: 2px solid transparent; background: #1A1D22; display: flex; align-items: center; gap: 14px; padding: 0 16px;">
          <span style="width: 42px; height: 42px; border-radius: 12px; background: #1F2E45; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path><path d="M10 20v-5h4v5"></path></svg></span>
          <span style="flex-grow: 1; font-size: 18px; font-weight: 700;">Home</span><span style="font-size: 15px; color: #8FA0B5;">Set as Home</span>
        </button>
        <button type="button" aria-pressed="false" style="font-family: inherit; color: inherit; text-align: left; height: 66px; box-sizing: border-box; border-radius: 16px; border: 2px solid transparent; background: #1A1D22; display: flex; align-items: center; gap: 14px; padding: 0 16px;">
          <span style="width: 42px; height: 42px; border-radius: 12px; background: #1F2E45; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg></span>
          <span style="flex-grow: 1; font-size: 18px; font-weight: 700;">Work</span><span style="font-size: 15px; color: #8FA0B5;">Set as Work</span>
        </button>
    </div>
  </div>
  <nav style="height: 102px; flex-shrink: 0; border-top: 1px solid #1F242B; background: #0E1013; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
    <a href="destinations.html" aria-label="Back" style="width: 74px; height: 74px; border-radius: 18px; background: #1F2328; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="flex-grow: 1; font-size: 16px; color: #8FA0B5; padding-left: 10px;">Routes come from Mapbox and need a connection to start</span>
    <a href="onroadnav.html" style="text-decoration: none; height: 74px; width: 260px; border-radius: 18px; background: #5AAAF8; color: #0B1A2B; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center;">Start</a>
  </nav>
</div>

</body>
</html>
