<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your car</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800;">Choose your car</h1>
      <span style="font-size: 15px; color: #AEB6C2;">Only needed if detection picked the wrong car. Choosing turns off automatic detection.</span>
    </div>
    <a href="vehicle.html" style="text-decoration: none; height: 56px; padding: 0 22px; border-radius: 16px; background: #23272E; color: #F2F5F9; font-size: 17px; font-weight: 700; display: flex; align-items: center;">Cancel</a>
    <a href="vehicle.html" style="text-decoration: none; height: 56px; padding: 0 28px; border-radius: 16px; background: #5AAAF8; color: #0B1A2B; font-size: 17px; font-weight: 800; display: flex; align-items: center;">Save</a>
  </div>
  <div style="flex-grow: 1; display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 14px; min-height: 0;">
    <div style="background: #16191D; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden;">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #8FA0B5; padding: 14px 20px 8px;">MAKE</span>
      <div role="listbox" aria-label="Make" style="display: flex; flex-direction: column; padding: 0 10px 10px; gap: 4px;">
        <button type="button" role="option" aria-selected="false" style="font-family: inherit; text-align: left; height: 50px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-size: 17px; font-weight: 600; padding: 0 12px;">Chevrolet</button>
        <button type="button" role="option" aria-selected="false" style="font-family: inherit; text-align: left; height: 50px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-size: 17px; font-weight: 600; padding: 0 12px;">Ford</button>
        <button type="button" role="option" aria-selected="false" style="font-family: inherit; text-align: left; height: 50px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-size: 17px; font-weight: 600; padding: 0 12px;">Honda</button>
        <button type="button" role="option" aria-selected="false" style="font-family: inherit; text-align: left; height: 50px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-size: 17px; font-weight: 600; padding: 0 12px;">Hyundai</button>
        <button type="button" role="option" aria-selected="false" style="font-family: inherit; text-align: left; height: 50px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-size: 17px; font-weight: 600; padding: 0 12px;">Kia</button>
        <button type="button" role="option" aria-selected="true" style="font-family: inherit; text-align: left; height: 50px; border: 2px solid #5AAAF8; border-radius: 12px; background: #182434; color: #F2F5F9; font-size: 17px; font-weight: 700; padding: 0 12px;">Toyota</button>
      </div>
    </div>
    <div style="background: #16191D; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden;">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #8FA0B5; padding: 14px 20px 8px;">MODEL</span>
      <div role="listbox" aria-label="Model" style="display: flex; flex-direction: column; padding: 0 10px 10px; gap: 4px;">
        <button type="button" role="option" aria-selected="false" style="font-family: inherit; text-align: left; height: 54px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-size: 17px; font-weight: 600; padding: 0 12px;">[Model, years]</button>
        <button type="button" role="option" aria-selected="true" style="font-family: inherit; text-align: left; height: 54px; border: 2px solid #5AAAF8; border-radius: 12px; background: #182434; color: #F2F5F9; font-size: 17px; font-weight: 700; padding: 0 12px; display: flex; align-items: center; justify-content: space-between;">[Model, years] <span style="font-size: 13px; color: #6FD8A0; font-weight: 600;">Detected</span></button>
        <button type="button" role="option" aria-selected="false" style="font-family: inherit; text-align: left; height: 54px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-size: 17px; font-weight: 600; padding: 0 12px;">[Model, years]</button>
        <button type="button" role="option" aria-selected="false" style="font-family: inherit; text-align: left; height: 54px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-size: 17px; font-weight: 600; padding: 0 12px;">[Model, years]</button>
        <button type="button" role="option" aria-selected="false" style="font-family: inherit; text-align: left; height: 54px; border: 0; border-radius: 12px; background: transparent; color: #E6EAF0; font-size: 17px; font-weight: 600; padding: 0 12px;">[Model, years]</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
