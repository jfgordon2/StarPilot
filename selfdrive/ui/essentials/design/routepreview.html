<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Route preview</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; gap: 14px; padding: 14px; overflow: hidden;">
  <div style="flex-grow: 1; min-width: 0; border-radius: 22px; overflow: hidden; position: relative; background: #111821;">
    <svg width="660" height="535" viewBox="0 0 660 535" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
      <g stroke="#1C2733" stroke-width="10" fill="none">
        <path d="M0 90H660M0 230H660M0 380H660M0 490H660"></path>
        <path d="M110 0V535M260 0V535M420 0V535M560 0V535"></path>
      </g>
      <g stroke="#253343" stroke-width="18" fill="none"><path d="M0 300C200 300 300 160 660 150"></path></g>
      <path d="M110 470V380H260V230C330 230 380 190 420 175V90H560" stroke="#5AAAF8" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="110" cy="470" r="13" fill="#0A0C0F" stroke="#5AAAF8" stroke-width="5"></circle>
      <path d="M560 62c-10 0-17 8-17 17 0 13 17 28 17 28s17-15 17-28c0-9-7-17-17-17z" fill="#F2F5F9"></path>
    </svg>
    <a href="destinations.html" aria-label="Back" style="position: absolute; left: 14px; top: 14px; width: 60px; height: 60px; border-radius: 16px; background: #0B0D10E6; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </div>
  <div style="width: 400px; flex-shrink: 0; background: #16191D; border-radius: 22px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800;">[Destination name]</h1>
      <span style="font-size: 16px; color: #AEB6C2;">[Street address, city]</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; background: #1E2227; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; color: #9FAABA;">Arrive</span><span style="font-size: 22px; font-weight: 700;">[ETA]</span></div>
      <div style="flex-grow: 1; background: #1E2227; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; color: #9FAABA;">Time</span><span style="font-size: 22px; font-weight: 700;">[min]</span></div>
      <div style="flex-grow: 1; background: #1E2227; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; color: #9FAABA;">Distance</span><span style="font-size: 22px; font-weight: 700;">[mi]</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #C9D0DA;">
      <div style="display: flex; gap: 10px; align-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Slows ahead of turns on the route</div>
      <div style="display: flex; gap: 10px; align-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Uses route speed limits when signs are missing</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; gap: 10px;">
      <button type="button" aria-label="Save as favorite" style="width: 64px; height: 64px; border: 0; border-radius: 16px; background: #23272E; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
      <a href="onroadnav.html" style="flex-grow: 1; text-decoration: none; height: 64px; border-radius: 16px; background: #5AAAF8; color: #0B1A2B; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center;">Start</a>
    </div>
  </div>
</div>

</body>
</html>
