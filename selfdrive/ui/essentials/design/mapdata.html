<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offline maps</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #0A0C0F; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 14px; min-height: 0;">
    <div style="display: flex; align-items: baseline; gap: 16px; padding: 0 6px;">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800;">Offline Maps</h1>
      <span style="font-size: 16px; color: #AEB6C2;">Speed limits and curves work without a connection</span>
    </div>
    <div style="display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; flex-grow: 1; min-height: 0;">
      <div style="background: #16191D; border-radius: 22px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: #7DBBF9;">YOUR REGION</span>
        <div style="display: flex; align-items: center; gap: 16px;">
          <div style="width: 60px; height: 60px; border-radius: 16px; background: #1F2E45; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7DBBF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 22px; font-weight: 700;">[Detected region]</span>
            <span style="font-size: 15px; color: #AEB6C2;">Picked from where you drive · [size]</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 15px; color: #6FD8A0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          Downloaded · Last updated [date]
        </div>
        <div style="flex-grow: 1;"></div>
        <a href="mapregions.html" style="text-decoration: none; height: 58px; border-radius: 14px; background: #1E2227; color: #F2F5F9; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 18px;">
          Add another region
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="background: #16191D; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
          <span style="font-size: 18px; font-weight: 700;">Keep up to date</span>
          <div role="radiogroup" aria-label="Auto update" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #23272E; border-radius: 13px; padding: 4px;">
            <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; border-radius: 10px; font-size: 16px; font-weight: 600;">Off</button>
            <button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 0; background: #5AAAF8; color: #0B1A2B; height: 44px; border-radius: 10px; font-size: 16px; font-weight: 700;">Weekly</button>
            <button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; border-radius: 10px; font-size: 16px; font-weight: 600;">Monthly</button>
          </div>
          <span style="font-size: 14px; color: #8FA0B5;">Updates download only while parked on Wi-Fi</span>
        </div>
        <div style="background: #16191D; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 18px; font-weight: 700;">Storage</span><span style="font-size: 15px; color: #AEB6C2;">[used] of [total]</span></div>
          <div style="height: 12px; border-radius: 6px; background: #2A2F36; display: flex; overflow: hidden;">
            <div style="width: 18%; background: #5AAAF8;"></div>
            <div style="width: 44%; background: #3B5677;"></div>
          </div>
          <div style="display: flex; gap: 18px; font-size: 14px; color: #AEB6C2;">
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #5AAAF8; display: block;"></span>Maps</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 3px; background: #3B5677; display: block;"></span>Drives and models</span>
          </div>
          <div style="flex-grow: 1;"></div>
          <button type="button" style="font-family: inherit; height: 48px; border-radius: 12px; border: 1px solid #5A3A40; background: transparent; color: #E58C98; font-size: 16px; font-weight: 600;">Remove maps</button>
        </div>
      </div>
    </div>
  </div>
  <nav style="height: 102px; flex-shrink: 0; border-top: 1px solid #1F242B; background: #0E1013; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
    <a href="destinations.html" aria-label="Back" style="width: 74px; height: 74px; border-radius: 18px; background: #1F2328; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <button type="button" style="font-family: inherit; height: 74px; padding: 0 32px; border-radius: 18px; border: 0; background: #5AAAF8; color: #0B1A2B; font-size: 18px; font-weight: 700;">StarPilot</button>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Device</button>
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Network</button>
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Bluetooth</button>
      <button type="button" style="font-family: inherit; height: 74px; border: 0; background: transparent; color: #C9D0DA; font-size: 18px; font-weight: 600;">Software</button>
    </div>
  </nav>
</div>

</body>
</html>
